# Lint configuration (used locally and in CI).
line-length = 110
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Scripts and tests put the repository root on sys.path before importing `src`,
# so their imports cannot be at the very top of the file.
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"docs/diagrams/*.py" = ["E402"]
