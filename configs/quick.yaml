# Tiny subset for a 5-minute smoke test. Uses labelled SYNTHETIC data only
# (synthetic: true) so `make smoke` needs no network and no GPU.
seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  synthetic: true
  synthetic_n_questions: 40
  synthetic_steps_range: [3, 8]

preprocessing:
  min_steps: 2
  error_free_code: -1

split:
  test_size: 0.25
  group_field: "question_id"

prefix_grid: [0.25, 0.50, 1.00]

probes:
  model: "Qwen/Qwen2.5-Math-1.5B-Instruct"
  generation_temperature: 0.7
  samples_per_question: 1
  default_layer: 18
  layer_sweep: [18]
  depth_bins: [[0.0, 0.50], [0.50, 1.01]]
  n_problems: 4
  max_new_tokens: 32
  logistic_C: 0.1
  logistic_max_iter: 1000

baselines:
  tfidf_max_features: 500
  tfidf_ngram_range: [1, 2]
  tfidf_min_df: 1

metrics:
  bootstrap_resamples: 100
  ece_bins: 10

intervention:
  thresholds: [0.5]
  escalation_threshold: 0.8
  token_budget: 64
  self_consistency_N: [2]

outputs:
  results_dir: "results"
  tables_dir: "results/tables"
  figures_dir: "results/figures"
  logs_dir: "results/logs"
  manifest: "results/manifest.json"
